<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users — EventSphere Admin</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/tables.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/notifications.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="dashboard-wrapper">
    <aside class="dashboard-sidebar">
      <div class="sidebar-brand">
        <a href="/index.html" style="display: flex; align-items: center; gap: 0.5rem;">
          <div class="logo-symbol" style="background: linear-gradient(135deg, #DC2626, #EF4444);">✦</div>
          <span class="brand-name">EventSphere Admin</span>
        </a>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-section-label">Administration</div>
        <a href="/admin/admin-dashboard.html" class="sidebar-link">
          <span class="sidebar-icon">🛡️</span> Command Center
        </a>
        <a href="/admin/events.html" class="sidebar-link">
          <span class="sidebar-icon">📅</span> All Events
        </a>
        <a href="/admin/users.html" class="sidebar-link active">
          <span class="sidebar-icon">👥</span> Users
        </a>
        <a href="/admin/venues.html" class="sidebar-link">
          <span class="sidebar-icon">🏢</span> Venues
        </a>
        <a href="/admin/payments.html" class="sidebar-link">
          <span class="sidebar-icon">💳</span> Transactions
        </a>
        <a href="/admin/reports.html" class="sidebar-link">
          <span class="sidebar-icon">📈</span> Reports
        </a>
        <a href="/admin/settings.html" class="sidebar-link">
          <span class="sidebar-icon">⚙️</span> System Config
        </a>
      </nav>
    </aside>

    <div class="dashboard-main">
      <header class="dashboard-topbar">
        <h1 class="dashboard-page-title">User Accounts Directory</h1>
        <div class="topbar-right-controls">
          <button class="theme-toggle-btn" aria-label="Toggle Theme">🌙</button>
        </div>
      </header>

      <main class="dashboard-body">
        <div class="table-wrapper">
          <div class="table-toolbar">
            <div class="table-search-box">
              <span class="input-icon">🔍</span>
              <input type="text" id="userSearchInput" class="input-control" placeholder="Search by name, email...">
            </div>
          </div>

          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>User Details</th>
                  <th>Role</th>
                  <th>Registered</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="adminUsersTable">
                <tr><td colspan="5" style="text-align: center; padding: 2rem;">Loading users...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/admin.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!Auth.requireAuth(['admin'])) return;
      Admin.loadRecentUsers();

      const searchInput = document.getElementById('userSearchInput');
      if (searchInput) {
        searchInput.addEventListener('input', Utils.debounce((e) => {
          const term = e.target.value.toLowerCase();
          const rows = document.querySelectorAll('#adminUsersTable tr');
          rows.forEach(r => {
            const text = r.textContent.toLowerCase();
            r.style.display = text.includes(term) ? '' : 'none';
          });
        }, 300));
      }
    });
  </script>
</body>
</html>
