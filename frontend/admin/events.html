<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events — EventSphere Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/admin/admin-theme.css">
  <link rel="stylesheet" href="/css/admin/admin-layout.css">
  <link rel="stylesheet" href="/css/admin/admin-components.css">
  <link rel="stylesheet" href="/css/admin/admin-dashboard.css">
  <link rel="stylesheet" href="/css/admin/admin-tables.css">
  <link rel="stylesheet" href="/css/admin/admin-forms.css">
  <link rel="stylesheet" href="/css/admin/admin-modal.css">
  <link rel="stylesheet" href="/css/admin/admin-responsive.css">
</head>
<body class="admin-body">

  <div class="admin-app">
    <aside class="admin-sidebar" data-admin-sidebar></aside>
    <div class="admin-main">
      <header class="admin-topbar" data-admin-topbar></header>
      <main class="admin-content">

        <div class="admin-page-header">
          <div>
            <h1 class="admin-page-title">Events</h1>
            <p class="admin-page-subtitle">Full lifecycle control — approve, feature, edit and moderate every event.</p>
          </div>
          <div class="admin-page-actions">
            <a class="admin-btn admin-btn-secondary admin-btn-sm" href="/admin/event-approvals.html">Approval Queue</a>
            <button class="admin-btn admin-btn-secondary admin-btn-sm" data-export-csv>Export CSV</button>
          </div>
        </div>

        <div class="admin-card">
          <div class="admin-toolbar">
            <div class="admin-search-field">
              <span class="sf-icon">🔍</span>
              <input type="text" data-search placeholder="Search events by title or city..." aria-label="Search events">
            </div>
            <select class="admin-select" data-filter-category aria-label="Filter by category">
              <option value="all">All Categories</option>
            </select>
            <select class="admin-select" data-filter-status aria-label="Filter by status">
              <option value="all">All Status</option>
              <option value="published">Published</option>
              <option value="pending">Pending</option>
              <option value="draft">Draft</option>
              <option value="cancelled">Cancelled</option>
              <option value="completed">Completed</option>
            </select>
            <select class="admin-select" data-filter-sort aria-label="Sort">
              <option value="newest">Newest First</option>
              <option value="date-asc">Date Ascending</option>
              <option value="date-desc">Date Descending</option>
              <option value="name">Name A–Z</option>
            </select>
            <div class="spacer"></div>
            <span class="admin-count" data-count>Loading…</span>
          </div>

          <div class="admin-table-scroll">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Event</th>
                  <th>Organizer</th>
                  <th>Category</th>
                  <th>Date</th>
                  <th>Tickets</th>
                  <th>Revenue</th>
                  <th>Status</th>
                  <th style="text-align:right;">Actions</th>
                </tr>
              </thead>
              <tbody id="eventsTable"></tbody>
            </table>
          </div>

          <div class="admin-table-footer">
            <span class="admin-count" data-count></span>
            <div class="admin-pagination" data-pagination></div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/admin/admin-layout.js"></script>
  <script src="/js/admin/events.js"></script>
</body>
</html>
