<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports — EventSphere Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/admin/admin-theme.css">
  <link rel="stylesheet" href="/css/admin/admin-layout.css">
  <link rel="stylesheet" href="/css/admin/admin-components.css">
  <link rel="stylesheet" href="/css/admin/admin-dashboard.css">
  <link rel="stylesheet" href="/css/admin/admin-tables.css">
  <link rel="stylesheet" href="/css/admin/admin-forms.css">
  <link rel="stylesheet" href="/css/admin/admin-modal.css">
  <link rel="stylesheet" href="/css/admin/admin-responsive.css">
</head>
<body class="admin-body">

  <div class="admin-app">
    <aside class="admin-sidebar" data-admin-sidebar></aside>
    <div class="admin-main">
      <header class="admin-topbar" data-admin-topbar></header>
      <main class="admin-content">

        <div class="admin-page-header">
          <div>
            <h1 class="admin-page-title">Reports</h1>
            <p class="admin-page-subtitle">Generate, preview and export platform reports.</p>
          </div>
        </div>

        <div class="admin-card admin-mb-6">
          <div class="admin-card-header">
            <div>
              <div class="admin-card-title">Report Builder</div>
              <div class="admin-card-subtitle">Choose a report type and date range</div>
            </div>
          </div>
          <div class="admin-card-body">
            <div class="admin-grid-4" data-report-types style="margin-bottom:var(--space-5);">
              <button class="admin-btn admin-btn-secondary admin-btn-sm active" data-type="users">User Report</button>
              <button class="admin-btn admin-btn-secondary admin-btn-sm" data-type="events">Event Report</button>
              <button class="admin-btn admin-btn-secondary admin-btn-sm" data-type="revenue">Revenue Report</button>
              <button class="admin-btn admin-btn-secondary admin-btn-sm" data-type="tickets">Ticket Report</button>
              <button class="admin-btn admin-btn-secondary admin-btn-sm" data-type="registrations">Registration Report</button>
              <button class="admin-btn admin-btn-secondary admin-btn-sm" data-type="organizers">Organizer Report</button>
            </div>
            <div class="admin-form-grid" style="max-width:560px;">
              <div class="admin-form-group">
                <label class="admin-form-label">From</label>
                <input type="date" class="admin-input" data-from>
              </div>
              <div class="admin-form-group">
                <label class="admin-form-label">To</label>
                <input type="date" class="admin-input" data-to>
              </div>
            </div>
            <div class="admin-form-actions" style="border-top:none;padding-top:var(--space-4);padding-left:0;">
              <button class="admin-btn admin-btn-secondary admin-btn-sm" data-print disabled>Print</button>
              <button class="admin-btn admin-btn-primary admin-btn-sm" data-export-csv>Export CSV</button>
              <button class="admin-btn admin-btn-secondary admin-btn-sm" data-run>Generate</button>
            </div>
          </div>
        </div>

        <div class="admin-card" id="reportPreviewCard" style="display:none;">
          <div class="admin-card-header">
            <div>
              <div class="admin-card-title" data-report-title>Preview</div>
              <div class="admin-card-subtitle" data-report-meta>Generated just now</div>
            </div>
            <span class="admin-count" data-report-count></span>
          </div>
          <div class="admin-table-scroll">
            <table class="admin-table" id="reportTable">
              <thead id="reportHead"></thead>
              <tbody id="reportBody"></tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/admin/admin-layout.js"></script>
  <script src="/js/admin/reports.js"></script>
</body>
</html>
