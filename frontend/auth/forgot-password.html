<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — EventSphere</title>
  <meta name="description" content="Reset your EventSphere account password.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/notifications.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body style="display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: var(--space-4); background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.08), transparent 50%), var(--bg-main);">

  <div class="card-base animate-fade-in-up" style="width: 100%; max-width: 440px; padding: var(--space-8); box-shadow: var(--shadow-xl);">
    <div style="text-align: center; margin-bottom: var(--space-6);">
      <a href="/index.html" style="display: inline-flex; align-items: center; gap: 0.5rem; font-family: var(--font-heading); font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem;">
        <div style="width: 36px; height: 36px; border-radius: var(--radius-md); background: linear-gradient(135deg, var(--primary-600), var(--accent-purple)); display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-weight: 800;">✦</div>
        <span>EventSphere</span>
      </a>
      <h1 style="font-size: var(--font-size-2xl); font-weight: 800; letter-spacing: -0.02em;">Reset Password</h1>
      <p style="color: var(--text-muted); font-size: var(--font-size-sm); margin-top: 0.25rem;">Enter your email to receive recovery instructions</p>
    </div>

    <form onsubmit="event.preventDefault(); Components.showToast('Password reset link sent to your inbox!', 'success'); setTimeout(() => window.location.href='/auth/reset-password.html', 1200);">
      <div class="form-group">
        <label class="form-label form-label-required">Registered Email Address</label>
        <div class="input-icon-wrap">
          <span class="input-icon">✉️</span>
          <input type="email" required class="input-control" placeholder="name@example.com">
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-full" style="margin-bottom: 1.25rem;">
        Send Recovery Link
      </button>

      <div style="text-align: center; font-size: var(--font-size-sm); color: var(--text-muted);">
        Remembered your password? <a href="/auth/login.html" style="color: var(--primary-600); font-weight: 600;">Back to Sign In</a>
      </div>
    </form>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
</body>
</html>
