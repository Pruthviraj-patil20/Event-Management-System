<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendee Management — EventSphere</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/tables.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/notifications.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="dashboard-wrapper">
    <aside class="dashboard-sidebar">
      <div class="sidebar-brand">
        <a href="/index.html" style="display: flex; align-items: center; gap: 0.5rem;">
          <div class="logo-symbol">✦</div>
          <span class="brand-name">EventSphere</span>
        </a>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-section-label">Management</div>
        <a href="/dashboard/dashboard.html" class="sidebar-link">
          <span class="sidebar-icon">📊</span> Dashboard
        </a>
        <a href="/dashboard/my-events.html" class="sidebar-link">
          <span class="sidebar-icon">📅</span> My Events
        </a>
        <a href="/dashboard/create-event.html" class="sidebar-link">
          <span class="sidebar-icon">➕</span> Create Event
        </a>
        <a href="/dashboard/attendees.html" class="sidebar-link active">
          <span class="sidebar-icon">👥</span> Attendees
        </a>
        <a href="/dashboard/tickets.html" class="sidebar-link">
          <span class="sidebar-icon">🎟️</span> My Tickets
        </a>
        <a href="/dashboard/analytics.html" class="sidebar-link">
          <span class="sidebar-icon">📈</span> Analytics
        </a>
        <a href="/dashboard/notifications.html" class="sidebar-link">
          <span class="sidebar-icon">🔔</span> Notifications
        </a>
      </nav>
    </aside>

    <div class="dashboard-main">
      <header class="dashboard-topbar">
        <h1 class="dashboard-page-title">Attendee Directory & Check-In</h1>
        <div class="topbar-right-controls">
          <button class="theme-toggle-btn" aria-label="Toggle Theme">🌙</button>
          <a href="/api/attendees/export" target="_blank" class="btn btn-secondary btn-sm">📥 Export CSV</a>
        </div>
      </header>

      <main class="dashboard-body">
        <div class="table-wrapper">
          <div class="table-toolbar">
            <div class="table-search-box">
              <span class="input-icon">🔍</span>
              <input type="text" id="attendeeSearchInput" class="input-control" placeholder="Search by name, email, or ticket ID...">
            </div>
            <div>
              <span style="font-size: 0.8125rem; color: var(--text-muted);">Real-time check-in and QR ticket validation</span>
            </div>
          </div>

          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Ticket ID</th>
                  <th>Attendee Name</th>
                  <th>Event</th>
                  <th>Tier</th>
                  <th>Amount</th>
                  <th>Status</th>
                  <th>Check In</th>
                </tr>
              </thead>
              <tbody id="attendeesTableBody">
                <tr><td colspan="7" style="text-align: center; padding: 2rem;">Loading registered attendees...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Core Scripts -->
  <script src="/js/utils.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/dashboard.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Dashboard.initAttendees();

      const searchInput = document.getElementById('attendeeSearchInput');
      if (searchInput) {
        searchInput.addEventListener('input', Utils.debounce((e) => {
          const term = e.target.value.toLowerCase();
          const rows = document.querySelectorAll('#attendeesTableBody tr');
          rows.forEach(r => {
            const text = r.textContent.toLowerCase();
            r.style.display = text.includes(term) ? '' : 'none';
          });
        }, 300));
      }
    });
  </script>
</body>
</html>
