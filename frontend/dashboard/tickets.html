<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tickets & Passes — EventSphere</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/modal.css">
  <link rel="stylesheet" href="/css/avatar-modal.css">
  <link rel="stylesheet" href="/css/notifications.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="dashboard-wrapper">
    <aside class="dashboard-sidebar">
      <div class="sidebar-brand">
        <a href="/index.html" style="display: flex; align-items: center; gap: 0.5rem;">
          <div class="logo-symbol">✦</div>
          <span class="brand-name">EventSphere</span>
        </a>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-section-label">Attendee Area</div>
        <a href="/dashboard/tickets.html" class="sidebar-link active">
          <span class="sidebar-icon">🎟️</span> My Tickets Wallet
        </a>
        <a href="/events.html" class="sidebar-link">
          <span class="sidebar-icon">🔍</span> Explore Events
        </a>
        <a href="/dashboard/notifications.html" class="sidebar-link">
          <span class="sidebar-icon">🔔</span> Notifications
        </a>
        <a href="/dashboard/settings.html" class="sidebar-link">
          <span class="sidebar-icon">⚙️</span> Settings
        </a>
      </nav>
    </aside>

    <div class="dashboard-main">
      <header class="dashboard-topbar">
        <h1 class="dashboard-page-title">Digital Ticket Wallet</h1>
        <div class="topbar-right-controls">
          <button class="theme-toggle-btn" aria-label="Toggle Theme">🌙</button>
          <a href="/events.html" class="btn btn-primary btn-sm">Explore More Events</a>
        </div>
      </header>

      <main class="dashboard-body">
        <div class="grid-3" id="myTicketsGrid">
          <!-- Populated dynamically via Tickets.init() -->
        </div>
      </main>
    </div>
  </div>

  <!-- Digital QR Ticket Pass Modal -->
  <div class="modal-backdrop" id="ticketQRModal">
    <div class="modal-dialog" style="max-width: 440px;">
      <div class="digital-ticket-pass" id="printablePass">
        <div class="ticket-pass-header">
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <div style="font-weight: 800; font-size: 1.25rem;">✦ EventSphere</div>
          </div>
          <span class="badge badge-success">VALID PASS</span>
        </div>

        <div class="ticket-pass-body">
          <h2 class="ticket-pass-event-title" id="passEventTitle">Event Title</h2>
          <div style="font-size: 0.8125rem; color: #94A3B8; margin-bottom: 1rem;" id="passVenue">Venue Location</div>

          <div class="ticket-qr-container">
            <img src="" alt="Dynamic QR Code" id="passQRCodeImg" class="ticket-qr-img">
          </div>

          <div class="ticket-notch-divider"></div>

          <div class="ticket-pass-details-grid">
            <div>
              <div class="ticket-pass-label">Attendee</div>
              <div class="ticket-pass-val" id="passAttendeeName">Attendee Name</div>
            </div>
            <div>
              <div class="ticket-pass-label">Tier / Seat</div>
              <div class="ticket-pass-val" id="passTier">VIP Pass</div>
            </div>
            <div>
              <div class="ticket-pass-label">Date</div>
              <div class="ticket-pass-val" id="passDate">Oct 24, 2026</div>
            </div>
            <div>
              <div class="ticket-pass-label">Ticket ID</div>
              <div class="ticket-pass-val" style="font-family: var(--font-mono); color: #818CF8;" id="passTicketNum">ESP-2026-XXXX</div>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer" style="justify-content: space-between; background-color: var(--bg-surface);">
        <button class="btn btn-secondary btn-sm" onclick="Tickets.printTicket()">🖨️ Print / Save PDF</button>
        <button class="btn btn-primary btn-sm" onclick="document.getElementById('ticketQRModal').classList.remove('active')">Done</button>
      </div>
    </div>
  </div>

  <!-- Core Scripts -->
  <script src="/js/utils.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/avatar-modal.js"></script>
  <script src="/js/tickets.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Tickets.init();
    });
  </script>
</body>
</html>
