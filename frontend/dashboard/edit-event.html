<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Event — EventSphere</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/notifications.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="dashboard-wrapper">
    <aside class="dashboard-sidebar">
      <div class="sidebar-brand">
        <a href="/index.html" style="display: flex; align-items: center; gap: 0.5rem;">
          <div class="logo-symbol">✦</div>
          <span class="brand-name">EventSphere</span>
        </a>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-section-label">Management</div>
        <a href="/dashboard/dashboard.html" class="sidebar-link">
          <span class="sidebar-icon">📊</span> Dashboard
        </a>
        <a href="/dashboard/my-events.html" class="sidebar-link active">
          <span class="sidebar-icon">📅</span> My Events
        </a>
        <a href="/dashboard/create-event.html" class="sidebar-link">
          <span class="sidebar-icon">➕</span> Create Event
        </a>
        <a href="/dashboard/attendees.html" class="sidebar-link">
          <span class="sidebar-icon">👥</span> Attendees
        </a>
        <a href="/dashboard/tickets.html" class="sidebar-link">
          <span class="sidebar-icon">🎟️</span> My Tickets
        </a>
        <a href="/dashboard/analytics.html" class="sidebar-link">
          <span class="sidebar-icon">📈</span> Analytics
        </a>
        <a href="/dashboard/notifications.html" class="sidebar-link">
          <span class="sidebar-icon">🔔</span> Notifications
        </a>
      </nav>
    </aside>

    <div class="dashboard-main">
      <header class="dashboard-topbar">
        <h1 class="dashboard-page-title">Edit Event</h1>
        <div class="topbar-right-controls">
          <button class="theme-toggle-btn" aria-label="Toggle Theme">🌙</button>
        </div>
      </header>

      <main class="dashboard-body">
        <div style="max-width: 800px; margin: 0 auto;">
          <form id="editEventForm">
            <div class="form-section-card">
              <h2 class="form-section-title">Event Details</h2>
              <p class="form-section-desc">Update event title, category, and description.</p>

              <div class="form-group">
                <label for="editTitle" class="form-label form-label-required">Event Title</label>
                <input type="text" id="editTitle" required class="input-control">
              </div>

              <div class="grid-2">
                <div class="form-group">
                  <label for="editCategory" class="form-label form-label-required">Category</label>
                  <select id="editCategory" required class="select-control">
                    <option value="Technology">Technology</option>
                    <option value="Music">Music</option>
                    <option value="Business">Business</option>
                    <option value="Sports">Sports</option>
                    <option value="Education">Education</option>
                    <option value="Workshop">Workshop</option>
                    <option value="Conference">Conference</option>
                    <option value="Festival">Festival</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="editDate" class="form-label form-label-required">Event Date</label>
                  <input type="date" id="editDate" required class="input-control">
                </div>
              </div>

              <div class="form-group">
                <label for="editDescription" class="form-label form-label-required">Description</label>
                <textarea id="editDescription" required class="textarea-control" style="min-height: 140px;"></textarea>
              </div>

              <div class="form-group">
                <label for="editImage" class="form-label">Banner Image URL</label>
                <input type="url" id="editImage" class="input-control">
              </div>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-bottom: 3rem;">
              <a href="/dashboard/my-events.html" class="btn btn-secondary btn-lg">Cancel</a>
              <button type="submit" class="btn btn-primary btn-lg">Save Changes</button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Auth.requireAuth(['organizer', 'admin'])) return;
      const eventId = Utils.getUrlParam('id');
      if (!eventId) {
        window.location.href = '/dashboard/my-events.html';
        return;
      }

      try {
        const data = await API.get(`/events/${eventId}`);
        const ev = data.event;
        document.getElementById('editTitle').value = ev.title;
        document.getElementById('editCategory').value = ev.category;
        document.getElementById('editDate').value = ev.date ? new Date(ev.date).toISOString().split('T')[0] : '';
        document.getElementById('editDescription').value = ev.description;
        document.getElementById('editImage').value = ev.image;

        const form = document.getElementById('editEventForm');
        form.onsubmit = async (e) => {
          e.preventDefault();
          try {
            await API.put(`/events/${eventId}`, {
              title: document.getElementById('editTitle').value,
              category: document.getElementById('editCategory').value,
              date: document.getElementById('editDate').value,
              description: document.getElementById('editDescription').value,
              image: document.getElementById('editImage').value
            });
            Components.showToast('Event updated successfully!', 'success');
            setTimeout(() => window.location.href = '/dashboard/my-events.html', 800);
          } catch (err) {
            Components.showToast(err.message, 'error');
          }
        };
      } catch (err) {
        Components.showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
