<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Settings — EventSphere</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/notifications.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="dashboard-wrapper">
    <aside class="dashboard-sidebar">
      <div class="sidebar-brand">
        <a href="/index.html" style="display: flex; align-items: center; gap: 0.5rem;">
          <div class="logo-symbol">✦</div>
          <span class="brand-name">EventSphere</span>
        </a>
      </div>

      <nav class="sidebar-nav">
        <a href="/dashboard/dashboard.html" class="sidebar-link">
          <span class="sidebar-icon">📊</span> Dashboard
        </a>
        <a href="/dashboard/my-events.html" class="sidebar-link">
          <span class="sidebar-icon">📅</span> My Events
        </a>
        <a href="/dashboard/tickets.html" class="sidebar-link">
          <span class="sidebar-icon">🎟️</span> My Tickets
        </a>
        <a href="/dashboard/notifications.html" class="sidebar-link">
          <span class="sidebar-icon">🔔</span> Notifications
        </a>
        <a href="/dashboard/settings.html" class="sidebar-link active">
          <span class="sidebar-icon">⚙️</span> Settings
        </a>
      </nav>
    </aside>

    <div class="dashboard-main">
      <header class="dashboard-topbar">
        <h1 class="dashboard-page-title">Profile & Organization Settings</h1>
        <div class="topbar-right-controls">
          <button class="theme-toggle-btn" aria-label="Toggle Theme">🌙</button>
        </div>
      </header>

      <main class="dashboard-body">
        <div style="max-width: 680px;">
          <form id="profileSettingsForm">
            <div class="form-section-card">
              <h2 class="form-section-title">Personal Profile</h2>
              <p class="form-section-desc">Manage your personal contact info and public avatar.</p>

              <div class="form-group">
                <label for="settingsName" class="form-label form-label-required">Full Name</label>
                <input type="text" id="settingsName" required class="input-control">
              </div>

              <div class="form-group">
                <label for="settingsEmail" class="form-label">Email Address (Read-only)</label>
                <input type="email" id="settingsEmail" disabled class="input-control" style="opacity: 0.6;">
              </div>

              <div class="form-group">
                <label for="settingsPhone" class="form-label">Phone Number</label>
                <input type="tel" id="settingsPhone" class="input-control">
              </div>

              <div class="form-group">
                <label for="settingsAvatar" class="form-label">Avatar Image URL</label>
                <input type="url" id="settingsAvatar" class="input-control">
              </div>

              <div class="form-group">
                <label for="settingsOrgName" class="form-label">Organization / Host Brand</label>
                <input type="text" id="settingsOrgName" class="input-control">
              </div>

              <div class="form-group">
                <label for="settingsBio" class="form-label">Public Bio</label>
                <textarea id="settingsBio" class="textarea-control" style="min-height: 90px;"></textarea>
              </div>

              <button type="submit" class="btn btn-primary">Save Profile Changes</button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!Auth.requireAuth()) return;
      const user = API.getCurrentUser();
      if (user) {
        document.getElementById('settingsName').value = user.name || '';
        document.getElementById('settingsEmail').value = user.email || '';
        document.getElementById('settingsPhone').value = user.phone || '';
        document.getElementById('settingsAvatar').value = user.profileImage || '';
        document.getElementById('settingsOrgName').value = user.organizationName || '';
        document.getElementById('settingsBio').value = user.bio || '';
      }

      const form = document.getElementById('profileSettingsForm');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          const payload = {
            name: document.getElementById('settingsName').value,
            phone: document.getElementById('settingsPhone').value,
            profileImage: document.getElementById('settingsAvatar').value,
            organizationName: document.getElementById('settingsOrgName').value,
            bio: document.getElementById('settingsBio').value
          };
          const data = await API.put('/users/profile', payload);
          API.setCurrentUser(data.user);
          Components.showToast('Profile updated successfully!', 'success');
        } catch (err) {
          Components.showToast(err.message, 'error');
        }
      });
    });
  </script>
</body>
</html>
