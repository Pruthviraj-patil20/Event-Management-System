<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <linearGradient id="esLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="esSparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="esGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer Rounded Capsule -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="url(#esLogoGrad)" filter="url(#esGlow)"/>
  <rect x="3" y="3" width="34" height="34" rx="9" fill="#0A0D14" fill-opacity="0.2" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Central Glowing Spark/Star -->
  <path d="M20 7C20 13.5 22.5 16 29 16C22.5 16 20 18.5 20 25C20 18.5 17.5 16 11 16C17.5 16 20 13.5 20 7Z" fill="url(#esSparkGrad)"/>
  <!-- Orbit Ring Accent -->
  <ellipse cx="20" cy="20" rx="13" ry="5.5" transform="rotate(-25 20 20)" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" stroke-dasharray="2 2"/>
  <circle cx="28" cy="14" r="1.5" fill="#FFFFFF"/>
</svg>
